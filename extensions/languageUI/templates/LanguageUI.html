{% include 'templates.html' %}

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
</head>
<style>
    .row {
        display: flex;
    }

    .column {
        flex: 12%;
        padding: 1px;
    }

    html,
    body {
        background-color: '#ffffff';
        overflow: hidden;
    }
</style>

<body class="unselectable"> 
    <div id="languageUI">   
        <!-- <mc-module id="languageUI" name="ASSISTANT ENGINE"> -->
        <h1>Welcome <span id="userid"></span> !</h1>

        <mc-scrollbox id='scrollboxLUI' style="--scrollbox-width: auto; --scrollbox-height: auto"> </mc-scrollbox>
        
        <mc-TextInput id="LUItextinput" type="textinput" fn="textinput" ></mc-TextInput>

        <button id="searchbuttonLUI" class="swagButton" onclick="processQuery()">GO</button>
        <button id="clearbutton" class="swagButton" onclick="clearChat()" style="float:right;">CLEAR CHAT HISTORY</button>

        <!-- </mc-module> --> 
    </div>
</body>

</html>

<script>

    function clearChat(){
        document.getElementById("scrollboxLUI").shadowRoot.getElementById("box").innerHTML = '';
    }

    function processQuery() {
        var text = document.getElementById("LUItextinput").shadowRoot.getElementById("text").value;
        var chatwin = document.getElementById("scrollboxLUI").shadowRoot.getElementById("box");
        var username = document.getElementById("userid").innerText;

        fetch("/LUI/languageUI_process", {
            method: "POST",
            body: JSON.stringify({
                usr: username,
                text: text,
            }),
            headers: {
                "Content-type": "application/json; charset=UTF-8"
            }
        })
        .then((response) => response.json())
        .then((json) => {
            console.log("C_DEBUG: LUI Response from server:", json);

            // Add user input to the chat window
            chatwin.innerHTML += `<b> Human | </b>${text}<br>`;

            // Parse the server's response using marked.js
            const formattedResponse = marked.parse(json.response.feedback);

            // Add the formatted response to the chat window
            chatwin.innerHTML += `<b> DATA | </b>${formattedResponse}<br>`;

            // Scroll to the bottom of the chat window
            chatwin.scrollTop = chatwin.scrollHeight;
                        
            // Add a timestamp to the chat window
            const timestamp = new Date().toLocaleTimeString();
            chatwin.innerHTML += `<span style="font-size: 0.8em; color: gray; float: right;">${timestamp}</span><br>`;

            // Clear the input field
            document.getElementById("LUItextinput").shadowRoot.getElementById("text").value = '';
        });
    }

    // Add event listener for Enter key
    document.getElementById("LUItextinput").shadowRoot.getElementById("text").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            processQuery();
            // do not add a new line
            event.preventDefault();
        }
    });

    // Change the placeholder text for the specific element
    document.addEventListener("DOMContentLoaded", function() {
                var specificElement = document.getElementById("LUItextinput");
                var shadowRoot = specificElement.shadowRoot;
                var textArea = shadowRoot.getElementById("text");
                
                textArea.placeholder = "Type something. e.g. 'Open project teapot.' ...";
    });


</script>
